app-id: io.github.uri_travoski.supershot
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: supershot
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=xdg-pictures
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-1-1
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: supershot
    buildsystem: cmake
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: .
